name: 'atb_bi_transformation'
version: '1.0.0'
config-version: 2

profile: 'atb_bi_transformation'

require-dbt-version: [">=1.9.0", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  raw_database: "ATB_BI"
  raw_schema: "PFE_ODS"
  dwh_schema: "PFE_DWH"
  ml_schema: "PFE_ML"

quoting:
  database: true
  schema: true
  identifier: false

models:
  atb_bi_transformation:
    staging:
      +materialized: table
    
    intermediate:
      +materialized: view
      +schema: "PFE_INTERMEDIATE"
    
    warehouse:
      +materialized: table
      
      dimensions:
        +tags: ["dimension"]
      
      facts:
        +tags: ["fact"]
