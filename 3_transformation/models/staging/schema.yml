version: 2

# Staging Layer - Minimal clean schema
models:
  - name: stg_account
    description: "Cleaned account data"
    columns:
      - name: account_id
        data_type: bigint
        tests: [not_null, unique]
      - name: customer_id
        data_type: bigint
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customer')
                field: customer_id
      - name: category_code
        data_type: varchar(50)
      - name: currency_code
        data_type: varchar(3)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_currency')
                field: currency_code
      - name: account_officer_id
        data_type: int
      - name: working_balance
        data_type: decimal(18, 2)
      - name: is_zero_balance
        data_type: bit
      - name: is_negative_balance
        data_type: bit
      - name: opening_date
        data_type: date
        tests: [not_null]
      - name: is_opening_date_defaulted
        data_type: bit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: account_age_days
        data_type: int
      - name: source_record_id
        data_type: varchar(255)
      - name: extracted_at_utc
        data_type: datetime

  - name: stg_customer
    description: "Cleaned customer data"
    columns:
      - name: customer_id
        data_type: bigint
        tests: [not_null, unique]
      - name: sector_code
        data_type: int
        tests:
          - relationships:
              arguments:
                to: ref('stg_sector')
                field: sector_code
      - name: account_officer_id
        data_type: int
        tests:
          - relationships:
              arguments:
                to: ref('stg_dao')
                field: account_officer_id
      - name: industry_code
        data_type: int
        tests:
          - relationships:
              arguments:
                to: ref('stg_industry')
                field: industry_code
      - name: target_code
        data_type: int
        tests:
          - relationships:
              arguments:
                to: ref('stg_target')
                field: target_code
      - name: customer_since_date
        data_type: date
        tests: [not_null]
      - name: is_customer_since_defaulted
        data_type: bit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: monthly_salary
        data_type: decimal(18, 2)
      - name: number_of_dependents
        data_type: int
      - name: is_kyc_complete
        data_type: bit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_pep
        data_type: bit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_compliance_flagged
        data_type: bit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: has_compliance_decision
        data_type: bit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: source_record_id
        data_type: varchar(255)
      - name: extracted_at_utc
        data_type: datetime

  - name: stg_customer_resolved
    description: "Customer with resolved codes"
    columns:
      - name: customer_id
        data_type: bigint
      - name: industry_code_resolved
        data_type: int
      - name: target_code_resolved
        data_type: int

  - name: stg_dao
    description: "DAO data"
    columns:
      - name: account_officer_id
        data_type: int
        tests: [not_null, unique]
      - name: dao_name
        data_type: varchar(max)
      - name: dao_area
        data_type: varchar(max)
      - name: parent_department_code
        data_type: int

  - name: stg_currency
    description: "Currency data"
    columns:
      - name: currency_code
        data_type: varchar(3)
        tests: [not_null, unique]
      - name: currency_name
        data_type: varchar(max)
      - name: no_of_decimals
        data_type: int

  - name: stg_sector
    description: "Sector data"
    columns:
      - name: sector_code
        data_type: int
        tests: [not_null, unique]
      - name: sector_description
        data_type: varchar(max)

  - name: stg_industry
    description: "Industry data"
    columns:
      - name: industry_code
        data_type: int
        tests: [not_null, unique]
      - name: industry_description
        data_type: varchar(max)

  - name: stg_target
    description: "Target data"
    columns:
      - name: target_code
        data_type: int
        tests: [not_null, unique]
      - name: target_description
        data_type: varchar(max)
