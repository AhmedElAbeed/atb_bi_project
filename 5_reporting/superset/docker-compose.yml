services:
  superset-db:
    image: postgres:15-alpine
    container_name: atb-superset-db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset-redis:
    image: redis:7-alpine
    container_name: atb-superset-redis
    volumes:
      - superset_redis_data:/data

  superset:
    image: apache/superset:4.1.2
    container_name: atb-superset
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_started
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: change-me-in-production
      SUPERSET_ENV: production
      SUPERSET_WEBSERVER_PORT: 8088
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_DATABASE_URI: sqlite:////app/superset_home/superset.db
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./pythonpath:/app/pythonpath
      - superset_home:/app/superset_home
    command:
      - /bin/bash
      - -lc
      - |
        superset db upgrade && \
        superset fab create-admin --username admin --firstname ATB --lastname Admin --email admin@atb.local --password admin123 || true && \
        superset init && \
        gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 120 "superset.app:create_app()"

volumes:
  superset_db_data:
  superset_redis_data:
  superset_home:
