services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks:
      - atb-network

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: atb-airflow:2.9.1
    container_name: atb-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=False
      - AIRFLOW_HOME=/opt/airflow
      - PYTHONPATH=/opt/airflow:/opt/airflow/ml_src
      - DBT_TARGET=prod
      - DBT_DRIVER=ODBC Driver 17 for SQL Server
      - DBT_SERVER=host.docker.internal
      - DBT_PORT=1434
      - DBT_DATABASE=ATB_BI
      - DBT_SCHEMA=PFE_DWH
      - DBT_USER=airbyte_user
      - DBT_PASSWORD=AZERTY123
      - DBT_ENCRYPT=false
      - DBT_TRUST_CERT=true
      - DBT_THREADS_PROD=8
      - DBT_TIMEOUT_SECONDS=300
      - DBT_RETRIES_PROD=3
      - SQL_SERVER_HOST=host.docker.internal
      - SQL_SERVER_PORT=1434
      - SQL_SERVER_DATABASE=ATB_BI
      - SQL_SERVER_DRIVER=ODBC Driver 17 for SQL Server
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ../3_transformation:/opt/airflow/dbt
      - ../4_ml/src:/opt/airflow/ml_src
      - ../1_ingestion/Data/raw:/opt/airflow/data/raw
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    networks:
      - atb-network

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: atb-airflow:2.9.1
    container_name: atb-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=False
      - AIRFLOW_HOME=/opt/airflow
      - PYTHONPATH=/opt/airflow:/opt/airflow/ml_src
      - DBT_TARGET=prod
      - DBT_DRIVER=ODBC Driver 17 for SQL Server
      - DBT_SERVER=host.docker.internal
      - DBT_PORT=1434
      - DBT_DATABASE=ATB_BI
      - DBT_SCHEMA=PFE_DWH
      - DBT_USER=airbyte_user
      - DBT_PASSWORD=AZERTY123
      - DBT_ENCRYPT=false
      - DBT_TRUST_CERT=true
      - DBT_THREADS_PROD=8
      - DBT_TIMEOUT_SECONDS=300
      - DBT_RETRIES_PROD=3
      # SQL Server Connection (for dbt and Python tasks)
      - SQL_SERVER_HOST=host.docker.internal
      - SQL_SERVER_PORT=1434
      - SQL_SERVER_DATABASE=ATB_BI
      - SQL_SERVER_DRIVER=ODBC Driver 17 for SQL Server
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ../3_transformation:/opt/airflow/dbt
      - ../4_ml/src:/opt/airflow/ml_src
      - ../1_ingestion/Data/raw:/opt/airflow/data/raw
    command: airflow webserver
    networks:
      - atb-network

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: atb-airflow:2.9.1
    container_name: atb-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=False
      - AIRFLOW_HOME=/opt/airflow
      - PYTHONPATH=/opt/airflow:/opt/airflow/ml_src
      - DBT_TARGET=prod
      - DBT_DRIVER=ODBC Driver 17 for SQL Server
      - DBT_SERVER=host.docker.internal
      - DBT_PORT=1434
      - DBT_DATABASE=ATB_BI
      - DBT_SCHEMA=PFE_DWH
      - DBT_USER=airbyte_user
      - DBT_PASSWORD=AZERTY123
      - DBT_ENCRYPT=false
      - DBT_TRUST_CERT=true
      - DBT_THREADS_PROD=8
      - DBT_TIMEOUT_SECONDS=300
      - DBT_RETRIES_PROD=3
      - SQL_SERVER_HOST=host.docker.internal
      - SQL_SERVER_PORT=1434
      - SQL_SERVER_DATABASE=ATB_BI
      - SQL_SERVER_DRIVER=ODBC Driver 17 for SQL Server
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ../3_transformation:/opt/airflow/dbt
      - ../4_ml/src:/opt/airflow/ml_src
      - ../1_ingestion/Data/raw:/opt/airflow/data/raw
    command: airflow scheduler
    networks:
      - atb-network

  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile
    image: atb-airflow:2.9.1
    container_name: atb-airflow-triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW_HOME=/opt/airflow
      - DBT_TARGET=prod
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    command: airflow triggerer
    networks:
      - atb-network

volumes:
  postgres_data:

networks:
  atb-network:
    driver: bridge
