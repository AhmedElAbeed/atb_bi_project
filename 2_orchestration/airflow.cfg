# Airflow Configuration for ATB BI Warehouse
# ============================================

[core]
# The home folder for airflow, default is ~/airflow
base_log_folder = /airflow/logs
dags_folder = /airflow/dags
plugins_folder = /airflow/plugins

# The executor class to use [SequentialExecutor, LocalExecutor, CeleryExecutor, KubernetesExecutor]
executor = LocalExecutor

# The database connection string for Airflow metadata
sql_alchemy_conn = sqlite:////airflow/airflow.db

# Enable the triggerer for deferrable operators
enable_xcom_pickling = True
max_active_tasks_per_dag = 4
max_active_runs_per_dag = 1

# Parallelism: total number of task instances that can run simultaneously
parallelism = 8

# DAG concurrency: number of tasks per DAG that can run in parallel
dag_concurrency = 4

# Task concurrency: default number of tasks per DAG to run in parallel
max_task_duration = 300

# Security: Do not expose airflow web UI to external network in production
expose_config = False
expose_config_file = False

[webserver]
# The port on which to run the web server
web_server_port = 8080

# Authentication backend
authentication_backends = airflow.contrib.auth.backends.password_auth

# Enable refresh on DAG change
reload_on_plugin_change = True
reload_on_pip_change = True

[scheduler]
# The number of seconds to wait after an airflow run completes before attempting to trigger
# the next scheduled run
catchup_by_default = False

# The number of seconds an auto-refresh task waits between attempts to run
dag_dir_list_interval = 300

[logging]
# Airflow can store logs remotely in S3, GCS, or other locations
remote_logging = False

[database]
# Ensure database connections are properly pooled
sql_alchemy_pool_size = 10
sql_alchemy_max_overflow = 10
sql_alchemy_pool_recycle = 3600

[email]
# Email backend for alerts
email_backend = airflow.providers.smtp.utils.EmailBackend

[smtp]
# SMTP configuration for email notifications
smtp_host = smtp.atb.local
smtp_starttls = True
smtp_ssl = False
smtp_user = airflow@atb.local
smtp_password = 
smtp_port = 587
smtp_mail_from = airflow@atb.local

[slack]
# Slack integration for notifications
slack_api_default = slack-api-token

[security]
# Secret backend for storing sensitive variables
secret_backend = airflow.providers.amazon.aws.secrets.secrets_manager.SecretsManagerBackend

[api]
# Enable API
enable_experimental_api = True

[operators]
# Default owner for tasks if not specified
default_queue = default

[logging_config]
# Custom logging configuration
log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s
simple_log_format = %%(asctime)s %%(levelname)s - %%(message)s
